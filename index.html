<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Suppress benign WebSocket or HMR connection failures common in sandbox/iframe environments
      (function() {
        var isWebSocketError = function(errorOrMsg) {
          if (!errorOrMsg) return false;
          var str = String(errorOrMsg.message || errorOrMsg);
          return str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('ws://') !== -1 || str.indexOf('wss://') !== -1;
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && isWebSocketError(event.reason)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event && (isWebSocketError(event.message) || isWebSocketError(event.error))) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
